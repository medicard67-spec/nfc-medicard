# Keeps the Render server awake. Render's free plan puts the server to sleep
# after 15 minutes without visitors, and waking it takes 20-50 seconds, so the
# next person to open the website or app waits. Visiting /health (no data, no
# login) every 10 minutes stops it from falling asleep.
# Turn it off from the repo's Actions tab ("Keep server awake" > Disable workflow).
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # also lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit /health
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://nfc-medicard.onrender.com/health
